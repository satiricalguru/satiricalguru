name: Generate Snake

permissions:
  contents: write

on:
  schedule:
    # run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#c41226&color_dots=#ebedf0,#f7c9cf,#ef8a98,#d63a50,#8f0a1c
            dist/github-contribution-grid-snake-dark.svg?color_snake=#ede7df&color_dots=#0e0b0b,#3a0c10,#6e0b14,#a3101f,#e01b34
            
      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
